<form id="filter-form"
      class="d-flex flex-wrap align-items-center gap-3 mb-2"
      hx-get="{% url 'posts:list' %}"
      hx-trigger="change"
      hx-include="#search-form"
      hx-target="#post-list"
      hx-swap="innerHTML">
    <div class="form-check">
        <input type="checkbox" class="form-check-input" id="filter-mine"
               name="mine" value="1" {% if params.mine %}checked{% endif %}>
        <label class="form-check-label small" for="filter-mine">내 글만</label>
    </div>
    <div class="form-check">
        <input type="checkbox" class="form-check-input" id="filter-attached"
               name="attached" value="1" {% if params.attached %}checked{% endif %}>
        <label class="form-check-label small" for="filter-attached">첨부파일 있음</label>
    </div>
    <div class="d-flex align-items-center gap-1">
        <label class="small text-muted" for="filter-from">등록일</label>
        <input type="date" class="form-control form-control-sm" style="width:auto"
               id="filter-from" name="date_from" value="{{ params.date_from|default_if_none:'' }}">
        <span class="small text-muted">부터</span>
        <input type="date" class="form-control form-control-sm" style="width:auto"
               id="filter-to" name="date_to" value="{{ params.date_to|default_if_none:'' }}">
        <span class="small text-muted">까지</span>
    </div>
    <select name="per_page" class="form-select form-select-sm" style="width:auto"
            aria-label="페이지당 건수">
        {% for size in page_sizes %}
            <option value="{{ size }}" {% if size == params.per_page %}selected{% endif %}>{{ size }}개씩</option>
        {% endfor %}
    </select>
    <input type="hidden" name="sort" value="{{ params.sort }}">
    <input type="hidden" name="order" value="{{ params.order }}">
</form>
