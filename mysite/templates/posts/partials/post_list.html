                {% empty %}
                    <tr>
                        <td colspan="5" class="text-center py-5">
                            <p class="mb-2">검색 결과가 없습니다.</p>
                            {% if searchKeyword %}
                                <p class="text-muted small mb-3">
                                    '{{ searchKeyword }}'와 일치하는 게시글을 찾지 못했습니다.
                                </p>
                                <button class="btn btn-sm btn-outline-secondary"
                                        hx-get="{% url 'posts:list' %}"
                                        hx-target="#post-list"
                                        hx-swap="innerHTML">
                                    전체 목록 보기
                                </button>
                            {% endif %}
                        </td>
                    </tr>
                {% endfor %}
