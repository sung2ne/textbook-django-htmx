{% if posts.has_next %}
    <tr id="load-more">
        <td colspan="6" class="text-center py-3">
            <button class="btn btn-outline-secondary btn-sm"
                    hx-get="{% url 'posts:more' %}?page={{ posts.next_page_number }}{% if searchType %}&searchType={{ searchType }}&searchKeyword={{ searchKeyword|urlencode }}{% endif %}"
                    hx-target="#load-more"
                    hx-swap="outerHTML"
                    hx-indicator="#load-more-spinner">
                더 보기
            </button>
            <span id="load-more-spinner"
                  class="htmx-indicator spinner-border spinner-border-sm ms-2"></span>
        </td>
    </tr>
{% elif posts.number > 1 %}
    <tr>
        <td colspan="6" class="text-center py-3 text-muted small">
            마지막입니다. 전체 {{ posts.paginator.count }}건
        </td>
    </tr>
{% endif %}
