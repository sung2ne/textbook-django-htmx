<form hx-post="{% url 'posts:modal-save' post_id=post.id %}"
      hx-target="#modal-body"
      hx-swap="innerHTML"
      hx-disabled-elt="find button">
    <div class="modal-header d-flex justify-content-between align-items-start p-3 border-bottom">
        <h5 class="mb-0">게시글 수정</h5>
        <button type="button" class="btn-close" aria-label="닫기" onclick="closeModal()"></button>
    </div>
    <div class="p-3">
        <div class="mb-3">
            <label for="modal-title" class="form-label">제목</label>
            <input type="text"
                   id="modal-title"
                   name="title"
                   class="form-control {% if errors.title %}is-invalid{% endif %}"
                   value="{{ form_data.title|default:post.title }}"
                   maxlength="200">
            {% if errors.title %}
                <div class="invalid-feedback">{{ errors.title.0 }}</div>
            {% endif %}
        </div>
        <div class="mb-3">
            <label for="modal-content" class="form-label">내용</label>
            <textarea id="modal-content"
                      name="content"
                      rows="10"
                      class="form-control {% if errors.content %}is-invalid{% endif %}">{{ form_data.content|default:post.content }}</textarea>
            {% if errors.content %}
                <div class="invalid-feedback">{{ errors.content.0 }}</div>
            {% endif %}
        </div>
    </div>
    <div class="p-3 border-top text-end">
        <button type="submit" class="btn btn-sm btn-primary">저장</button>
        <button type="button" class="btn btn-sm btn-secondary"
                hx-get="{% url 'posts:modal' post_id=post.id %}"
                hx-target="#modal-body"
                hx-swap="innerHTML">
            취소
        </button>
    </div>
</form>
