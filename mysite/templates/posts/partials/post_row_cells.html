<td class="text-center">
    {% if post.created_by_id == request.user.id %}
        <input type="checkbox"
               class="form-check-input post-check"
               name="ids"
               value="{{ post.id }}"
               aria-label="{{ post.title }} 선택">
    {% endif %}
</td>
<td class="text-center">{{ post.index_number|default:"-" }}</td>
<td>
    <a href="{% url 'posts:read' post_id=post.id %}">{{ post.title }}</a>
    <button class="btn btn-sm btn-link p-0 ms-1"
            title="상세 보기"
            hx-get="{% url 'posts:modal' post_id=post.id %}"
            hx-target="#modal-body"
            hx-swap="innerHTML">
        상세
    </button>
    {% if post.created_by_id == request.user.id %}
        <button class="btn btn-sm btn-link p-0 ms-1"
                title="제목 수정"
                hx-get="{% url 'posts:edit-row' post_id=post.id %}"
                hx-target="closest tr"
                hx-swap="outerHTML">
            수정
        </button>
        <button class="btn btn-sm btn-link p-0 ms-1 text-danger"
                title="삭제"
                hx-delete="{% url 'posts:delete-row' post_id=post.id %}"
                hx-confirm="'{{ post.title }}' 게시글을 삭제합니다. 첨부파일도 함께 삭제되며 되돌릴 수 없습니다."
                hx-target="closest tr"
                hx-swap="outerHTML">
            삭제
        </button>
    {% endif %}
</td>
<td class="text-center">{{ post.created_by.first_name }}</td>
<td class="text-center">{{ post.created_at | date:"Y-m-d H:i" }}</td>
<td class="text-center d-none d-md-table-cell">{{ post.updated_at | date:"Y-m-d H:i" }}</td>
