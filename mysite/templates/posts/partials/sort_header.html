<a href="#"
   class="text-decoration-none {% if not header.active %}text-muted{% endif %}"
   hx-get="{% url 'posts:list' %}"
   hx-vals='{"sort": "{{ header.key }}", "order": "{{ header.next_order }}"}'
   hx-include="#search-form, #filter-form"
   hx-target="#post-list"
   hx-swap="innerHTML">
    {{ header.label }}{% if header.active %} {{ header.arrow }}{% endif %}
</a>
